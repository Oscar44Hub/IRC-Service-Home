<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#111" stroke-width="5"/>
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#111" stroke-width="2.5"/>

  <!-- Top curved text: HOME -->
  <path id="topArc" d="M 22,100 a78,78 0 0,1 156,0" fill="none"/>
  <text font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#111" letter-spacing="6">
    <textPath href="#topArc" startOffset="18%">· HOME ·</textPath>
  </text>

  <!-- Bottom curved text: SERVICE -->
  <path id="bottomArc" d="M 178,100 a78,78 0 0,1 -156,0" fill="none"/>
  <text font-family="Arial Black, sans-serif" font-size="18" font-weight="900" fill="#111" letter-spacing="4">
    <textPath href="#bottomArc" startOffset="14%">· SERVICE ·</textPath>
  </text>

  <!-- IRC text -->
  <text x="100" y="118" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="68" font-weight="900" fill="#111">IRC</text>

  <!-- Wrench icon top -->
  <g transform="translate(88, 28) rotate(45)">
    <rect x="-4" y="-14" width="8" height="28" rx="3" fill="#111"/>
    <rect x="-7" y="-14" width="14" height="6" rx="2" fill="#111"/>
    <rect x="-7" y="8" width="14" height="6" rx="2" fill="#111"/>
  </g>
</svg>
